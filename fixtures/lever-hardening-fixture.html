<!doctype html><html lang="en"><meta charset="utf-8"><title>Lever captured control regression</title>
<!-- Sanitized control structure captured 2026-09-19 from
https://jobs.lever.co/cscgeneration-2/40715594-0edc-4909-967c-71d252215c51/apply.
Local behavior models retrieveLocations.js: input opens, keydown debounces,
mousedown commits JSON, blur rejects uncommitted text. No production requests. -->
<style>body{font:16px sans-serif;padding:24px}main{max-width:700px}.application-question{margin:20px 0}input,textarea{padding:8px}label{display:block}.dropdown-location{padding:8px;cursor:pointer}.dropdown-loading-results{display:none}</style>
<body data-submissions="0"><main><h1>Submit your application</h1><form>
<div class="application-question"><label><span class="application-label">Full name</span><input name="name" required></label></div>
<div class="application-question"><div class="application-label multiple-select">Pronouns</div><div class="application-field"><ul id="candidatePronounsCheckboxes" data-qa="candidatePronounsCheckboxes">
<li><label><input type="checkbox" name="pronouns" value="He/him" class="standardPronounsOption"><span class="application-answer-alternative">He/him</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="She/her" class="standardPronounsOption"><span class="application-answer-alternative">She/her</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="They/them" class="standardPronounsOption"><span class="application-answer-alternative">They/them</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Xe/xem" class="standardPronounsOption"><span>Xe/xem</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Ze/hir" class="standardPronounsOption"><span>Ze/hir</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Ey/em" class="standardPronounsOption"><span>Ey/em</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Hir/hir" class="standardPronounsOption"><span>Hir/hir</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Fae/faer" class="standardPronounsOption"><span>Fae/faer</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Hu/hu" class="standardPronounsOption"><span>Hu/hu</span></label></li>
<li><label><input type="checkbox" name="pronouns" value="Use name only" id="useNameOnlyPronounsOption"><span>Use name only</span></label></li>
<li><label><input type="checkbox" value="Custom" id="customPronounsOption"><span>Custom</span></label><input style="display:none" id="customPronounsTextField" maxlength="40" name="pronouns" placeholder="Write here..."></li>
</ul></div></div>
<div class="application-question"><label><span class="application-label">Current location</span><div class="application-field"><input class="location-input" id="location-input" name="location"><input type="hidden" id="selected-location" name="selectedLocation" value="{&quot;name&quot;:&quot;&quot;}"><div class="dropdown-container" style="display:none"><div class="dropdown-results"></div><div class="dropdown-loading-results">Loading</div></div></div></label></div>
<h3>LOCATION</h3><div class="application-question custom-question"><div><div class="application-label full-width text"><div class="text">Where do you live? (City and State/Province)<span class="required">✱</span></div></div><div class="application-field full-width required-field"><input required class="card-field-input" placeholder="Type your response" name="cards[residence][field0]"></div></div></div>
<h3>SALARY EXPECTATIONS OPEN RESPONSE</h3><div class="application-question custom-question"><div><div class="application-label full-width text"><div class="text">What is your desired total compensation range for this role?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><input required class="card-field-input" placeholder="Type your response" name="cards[salary][field0]"></div></div></div>
<h3>LINKEDIN</h3><div class="application-question custom-question"><div><div class="application-label full-width textarea"><div class="text">LinkedIn Link<span class="required">✱</span></div></div><div class="application-field full-width required-field"><textarea class="card-field-input" name="cards[linkedin][field0]" required></textarea></div></div></div>
<button type="submit">Submit application</button></form></main>
<script>
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.body.dataset.submissions=String(+document.body.dataset.submissions+1)});
const input=document.querySelector('.location-input'), hidden=document.querySelector('[name=selectedLocation]'), menu=document.querySelector('.dropdown-container'), results=menu.querySelector('.dropdown-results'), loading=menu.querySelector('.dropdown-loading-results');
let timer, request=0;
input.addEventListener('input',()=>{menu.style.display='block';hidden.value='';});
input.addEventListener('keydown',()=>{clearTimeout(timer);const generation=++request;timer=setTimeout(()=>{
results.replaceChildren(); if(!input.value)return;loading.style.display='block';
setTimeout(()=>{if(generation!==request)return;loading.style.display='none';for(const name of ['Toronto, OH, USA','Toronto, ON, CAN']){const option=document.createElement('div');option.className='dropdown-location';option.textContent=name;option.addEventListener('mousedown',e=>{e.preventDefault();hidden.value=JSON.stringify({name,id:name.includes('CAN')?'ca-toronto':'us-toronto'});input.value=name;menu.style.display='none';results.replaceChildren();document.body.dataset.acceptedLocation=name;});results.append(option);}},120);
},500)});
input.addEventListener('blur',()=>{if(menu.style.display!=='none'){input.value='';hidden.value='';menu.style.display='none';results.replaceChildren();}});
const group=document.querySelector('#candidatePronounsCheckboxes'), custom=document.querySelector('#customPronounsOption'), customText=document.querySelector('#customPronounsTextField'), nameOnly=document.querySelector('#useNameOnlyPronounsOption');
group.addEventListener('change',e=>{if(e.target===custom&&custom.checked){group.querySelectorAll('input[type=checkbox]').forEach(el=>{if(el!==custom)el.checked=false});customText.style.display='block';}else if(e.target.checked){if(e.target===nameOnly)group.querySelectorAll('.standardPronounsOption').forEach(el=>el.checked=false);else nameOnly.checked=false;custom.checked=false;customText.style.display='none';customText.value='';}});
</script></body></html>
