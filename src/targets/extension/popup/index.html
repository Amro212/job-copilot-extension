<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{VISUAL_NAME}}</title>
  <link rel="stylesheet" href="../assets/theme.css" />
</head>
<body class="popup">
  <header>
    <h1>{{VISUAL_NAME}} <span class="version" id="version"></span></h1>
    <span class="badge warn" id="key-status">No key</span>
  </header>
  <dl>
    <dt>Fields on page</dt><dd id="field-count">-</dd>
    <dt>Frames with fields</dt><dd id="frame-count">-</dd>
    <dt>Model</dt><dd id="model">-</dd>
  </dl>
  <button id="toggle-panel">Toggle panel</button>
  <button class="secondary" id="open-options">Options and profile</button>
  <p class="note" id="note"></p>
  <script src="index.js"></script>
</body>
</html>
