name: Build, Sign & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Determine version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Assigning XPI version: $VERSION (canonical site version: $BASE_VERSION)"

      - name: Build Firefox extension
        run: npm run build:extension

      - name: Stamp unique version in extension manifest
        shell: bash
        run: |
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const path = 'dist/firefox/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Create source archive for Mozilla
        shell: bash
        run: |
          zip -r dist/kareer-source.zip \
            src \
            tools \
            package.json \
            package-lock.json \
            README.md \
            -x "*/node_modules/*"

      - name: Sign extension with Mozilla (Unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p dist/signed
          npx web-ext sign \
            --source-dir=dist/firefox \
            --artifacts-dir=dist/signed \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --upload-source-code=dist/kareer-source.zip \
            --approval-timeout=900000 \
            --no-input

      - name: Stage signed XPI in site downloads
        shell: bash
        run: |
          SIGNED_XPI=$(find dist/signed -type f -name "*.xpi" | head -n 1)
          if [ -z "$SIGNED_XPI" ]; then
            echo "Mozilla did not return a signed XPI."
            exit 1
          fi
          mkdir -p site/downloads
          cp "$SIGNED_XPI" site/downloads/kareer-firefox.xpi
          echo "Copied signed XPI to site/downloads/kareer-firefox.xpi"

      - name: Sync site version and Firefox update manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const xpiVersion = process.env.VERSION;
          const baseVersion = process.env.BASE_VERSION;
          if (!xpiVersion || !baseVersion) {
            throw new Error('VERSION and BASE_VERSION must be set');
          }

          const manifest = JSON.parse(fs.readFileSync('dist/firefox/manifest.json', 'utf8'));
          const addonId = manifest.browser_specific_settings?.gecko?.id;
          if (!addonId) {
            throw new Error('Firefox manifest is missing browser_specific_settings.gecko.id');
          }

          const updates = {
            addons: {
              [addonId]: {
                updates: [{
                  version: xpiVersion,
                  update_link: 'https://amro212.github.io/kareer/downloads/kareer-firefox.xpi'
                }]
              }
            }
          };
          fs.writeFileSync('site/firefox-updates.json', JSON.stringify(updates, null, 2) + '\n');
          fs.writeFileSync('site/version.json', JSON.stringify({ version: baseVersion }, null, 2) + '\n');

          let html = fs.readFileSync('site/index.html', 'utf8');
          html = html.replace(/(data-version-badge>)[^<]*(<\/span>)/g, '$1v' + baseVersion + '$2');
          html = html.replace(/src="script\.js(\?v=[^"']*)?"/g, 'src="script.js?v=' + baseVersion + '"');
          fs.writeFileSync('site/index.html', html);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
