name: Firefox Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox extension
        run: npm run build:extension

      - name: Read extension version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firefox version: $VERSION"

      - name: Create source archive for Mozilla
        shell: bash
        run: |
          zip -r dist/kareer-source.zip \
            src \
            tools \
            package.json \
            package-lock.json \
            README.md \
            -x "*/node_modules/*"

      - name: Sign extension with Mozilla
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p dist/signed

          npx web-ext sign \
            --source-dir=dist/firefox \
            --artifacts-dir=dist/signed \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --upload-source-code=dist/kareer-source.zip \
            --approval-timeout=900000 \
            --no-input

      - name: Normalize signed XPI filename
        shell: bash
        run: |
          SIGNED_XPI=$(find dist/signed -type f -name "*.xpi" | head -n 1)

          if [ -z "$SIGNED_XPI" ]; then
            echo "Mozilla did not return a signed XPI."
            exit 1
          fi

          cp "$SIGNED_XPI" dist/kareer-firefox.xpi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "firefox-v${VERSION}" \
            dist/kareer-firefox.xpi \
            --target "${GITHUB_SHA}" \
            --title "Kareer Firefox ${VERSION}" \
            --notes "Automated signed Firefox build."

      - name: Generate Firefox update manifest
        shell: bash
        run: |
          GECKO_ID=$(node -p "require('./src/targets/extension/manifest.firefox.json').browser_specific_settings.gecko.id")
          cat > firefox-updates.json <<EOF
          {
            "addons": {
              "${GECKO_ID}": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/Amro212/kareer/releases/download/firefox-v${VERSION}/kareer-firefox.xpi"
                  }
                ]
              }
            }
          }
          EOF

      - name: Commit update manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firefox-updates.json
          git commit -m "chore: update Firefox release manifest [skip ci]"
          git push